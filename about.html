<!DOCTYPE html>
<html lang="zh-CN"> 
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>关于我 | Gray Miller</title>
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Roboto', 'Montserrat', Arial, sans-serif;
      background: #f6f8fa;
      color: #22223b;
    }
    .navbar {
      background: #fff;
      box-shadow: 0 2px 8px rgba(107, 70, 193, 0.08);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 0;
      border-bottom: 1.5px solid #e9d5ff;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .navbar-inner {
      display: flex;
      gap: 0;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      align-items: center;
      padding: 0 24px;
    }
    .navbar a {
      color: #6b46c1;
      text-decoration: none;
      font-weight: 700;
      letter-spacing: 1px;
      font-size: 1.08em;
      padding: 18px 22px;
      border-radius: 0;
      transition: background 0.2s, color 0.2s;
      display: block;
    }
    .navbar a:hover {
      background: #f3e8ff;
      color: #9333ea;
    }
    .card {
      max-width: 900px;
      margin: 48px auto 0 auto;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 8px 32px rgba(107, 70, 193, 0.10);
      padding: 56px 48px 40px 48px;
      border: 1.5px solid #e9d5ff;
      position: relative;
    }
    .card h2 {
      color: #6b46c1;
      margin-top: 0;
      font-size: 2.1em;
      font-weight: 900;
      letter-spacing: 1.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card h2::before {
      content: "👤";
      display: inline-block;
    }
    .card p {
      font-size: 1.12em;
      line-height: 1.85;
      margin-bottom: 18px;
      color: #4a5568;
    }
    .contact-box {
      margin-top: 32px;
      background: linear-gradient(90deg, #f3e8ff, #fae8ff);
      border-radius: 12px;
      padding: 22px 28px;
      display: inline-block;
      font-size: 1.08em;
      color: #6b21a8;
      border: 2px solid #d8b4fe;
      font-weight: 600;
    }
    .contact-box a {
      color: #37946e;
      text-decoration: underline;
    }
    .footer {
      text-align: center;
      font-size: 1.08em;
      color: #6b46c1;
      background: none;
      margin: 60px 0 20px 0;
      letter-spacing: 1px;
    }
    @media (max-width: 700px) {
      .navbar-inner {
        padding: 0 8px;
      }
      .card {
        margin: 18px 8px 0 8px;
        padding: 28px 12px 18px 12px;
        border-radius: 12px;
      }
      .card h2 {
        font-size: 1.27em;
      }
      .card p {
        font-size: 0.98em;
      }
      .footer {
        font-size: 0.9em;
        margin: 24px 0 8px 0;
      }
      .contact-box {
        font-size: 0.95em;
        padding: 10px 7px;
      }
    }
  </style>
</head>
<body>
  <div class="navbar">
    <div class="navbar-inner">
      <a href="/devfest-mcp-website/index.html">首页</a>
      <a href="/devfest-mcp-website/gdg-devfest.html">GDG与DevFest</a>
      <a href="/devfest-mcp-website/devtools-mcp.html">DevTools MCP</a>
      <a href="/devfest-mcp-website/about.html">关于我</a>
    </div>
  </div>
  <div class="card">
    <h2>关于 Gray Miller</h2>
    <p><strong>身份：</strong>DevOps 工程师</p>
    <p><strong>个人简介：</strong><br>
      你好！我是 Gray Miller，一名热爱技术和分享的 DevOps 工程师。在探索高效的开发运维协作技术同时，我也热衷于将全球最新 IT 实践引入到实际工程场景。除技术外，我喜欢美食文化，乐于发现和尝试新鲜的美味。
    </p>
    <div class="contact-box">
      <strong>联系方式：</strong> <a href="mailto:graymiller@outloou.com">graymiller@outloou.com</a>
    </div>
  </div>
  <div class="footer">
    &copy; 2025 Gray Miller | Google DevFest Workshop
  </div>
</body>
</html>
